name: Mitta Enterprise AI CI/CD to AWS

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mitta-aws-production-deployment
  cancel-in-progress: false

jobs:
  integration:
    name: Continuous Integration checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m compileall -q app worker

  build-and-push:
    name: Build and push image - Continuous Delivery
    if: github.ref == 'refs/heads/main'
    needs: integration
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-2' }}
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-2' }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image URI
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY_NAME }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$REGISTRY" || -z "$REPOSITORY" ]]; then
            echo "Set ECR_REPOSITORY_NAME as a GitHub Actions production variable and verify the ECR login output." >&2
            exit 1
          fi
          echo "image=$REGISTRY/$REPOSITORY:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.image }}

  deploy:
    name: Deploy to EC2 - Continuous Deployment
    if: github.ref == 'refs/heads/main'
    needs: build-and-push
    environment: production
    runs-on: [self-hosted, linux, x64, mitta-ec2]
    env:
      AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-2' }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-2' }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy and verify application
        shell: bash
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          HOST_PORT: ${{ vars.APP_HOST_PORT || '8000' }}
          CONTAINER_PORT: ${{ vars.APP_CONTAINER_PORT || '8000' }}
          HEALTH_PATH: ${{ vars.APP_HEALTH_PATH || '/' }}
        run: |
          set -Eeuo pipefail

          container_name="mitta"
          previous_image=""
          deployment_succeeded=false

          if [[ -z "$IMAGE" || "$IMAGE" != */* ]]; then
            echo "Invalid image URI; check ECR_REPOSITORY_NAME." >&2
            exit 1
          fi
          if [[ -z "$DATABASE_URL" || -z "$PINECONE_API_KEY" || -z "$S3_BUCKET" ]]; then
            echo "Set DATABASE_URL, PINECONE_API_KEY and S3_BUCKET as production secrets." >&2
            exit 1
          fi

          app_env=(--env DATABASE_URL --env PINECONE_API_KEY --env S3_BUCKET)

          docker pull "$IMAGE"

          # Remember the currently running image for rollback, then remove the old container
          if docker container inspect "$container_name" >/dev/null 2>&1; then
            previous_image="$(docker inspect --format '{{.Config.Image}}' "$container_name")"
            docker rm -f "$container_name"
          fi

          start_container() {
            docker run -d --name "$container_name" --restart unless-stopped \
              -p "${HOST_PORT}:${CONTAINER_PORT}" \
              "${app_env[@]}" \
              "$1"
          }

          start_container "$IMAGE"

          # Health check: up to ~150 seconds (RAG apps can be slow to load models)
          for i in $(seq 1 30); do
            running="$(docker inspect -f '{{.State.Running}}' "$container_name" 2>/dev/null || echo false)"
            if [[ "$running" != "true" ]]; then
              echo "Container stopped during startup." >&2
              break
            fi
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${HOST_PORT}${HEALTH_PATH}" || true)"
            echo "Attempt $i: HTTP $code"
            if [[ "$code" =~ ^[234] ]]; then
              deployment_succeeded=true
              break
            fi
            sleep 5
          done

          if [[ "$deployment_succeeded" != "true" ]]; then
            echo "::error::Health check failed. Container logs:" >&2
            docker logs --tail 100 "$container_name" >&2 || true
            docker rm -f "$container_name" || true
            if [[ -n "$previous_image" ]]; then
              echo "Rolling back to $previous_image" >&2
              start_container "$previous_image"
            fi
            exit 1
          fi

          docker image prune -f   # keeps the EC2 disk from filling up with old images

          token="$(curl -s -X PUT "http://169.254.169.254/latest/api/token" \
            -H "X-aws-ec2-metadata-token-ttl-seconds: 60" || true)"
          public_ip="$(curl -s -H "X-aws-ec2-metadata-token: $token" \
            http://169.254.169.254/latest/meta-data/public-ipv4 || true)"

          echo "Deployed $IMAGE -> http://${public_ip:-<public-ip>}:${HOST_PORT}"