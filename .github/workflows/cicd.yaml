name: Mitta Enterprise AI CI/CD to AWS

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-2' }}

concurrency:
  group: mitta-aws-production-deployment
  cancel-in-progress: false

jobs:
  integration:
    name: Continuous Integration checks
    runs-on: self-hosted
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m compileall -q app worker

  build-and-push:
    name: Build and push image - Continuous Delivery
    if: github.ref == 'refs/heads/main'
    needs: integration
    runs-on: self-hosted
    permissions:
      id-token: write
      contents: read
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Debug OIDC claims and raw STS response
        run: |
          TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          case $(( ${#PAYLOAD} % 4 )) in 2) PAYLOAD="$PAYLOAD==";; 3) PAYLOAD="$PAYLOAD=";; esac
          echo "$PAYLOAD" | base64 -d | jq '{sub, aud, iss, repository, repository_id, repository_owner_id, ref}'

          aws sts assume-role-with-web-identity \
            --role-arn "${{ secrets.AWS_ROLE_ARN }}" \
            --role-session-name oidc-debug \
            --web-identity-token "$TOKEN" \
            --query 'AssumedRoleUser.Arn' --output text || true


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-2' }}
          role-skip-session-tagging: true

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image URI
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
        run: echo "image=$REGISTRY/$REPOSITORY:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.image }}

  deploy:
    name: Deploy to EC2 - Continuous Deployment
    if: github.ref == 'refs/heads/main'
    needs: build-and-push
    runs-on: [self-hosted, linux, x64, mitta-ec2]
    env:
      IMAGE: ${{ needs.build-and-push.outputs.image }}
    steps:
      - name: Deploy and verify application
        shell: bash
        run: |
          set -Eeuo pipefail

          container_name="mitta"
          env_file="/opt/Mitta/.env"
          registry="${IMAGE%%/*}"
          previous_image=""
          deployment_succeeded=false

          if [[ ! -r "$env_file" ]]; then
            echo "Runtime environment file is missing or unreadable: $env_file" >&2
            exit 1
          fi

          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$registry"
          docker pull "$IMAGE"

          if docker inspect "$container_name" >/dev/null 2>&1; then
            previous_image="$(docker inspect --format '{{.Config.Image}}' "$container_name")"
          fi

          rollback_on_failure() {
            status=$?
            if [[ "$status" -ne 0 && "$deployment_succeeded" != true ]]; then
              echo "Deployment failed; attempting to restore the previous container." >&2
              docker rm -f "$container_name" >/dev/null 2>&1 || true
              if [[ -n "$previous_image" ]]; then
                docker run -d \
                  --name "$container_name" \
                  --restart unless-stopped \
                  --env-file "$env_file" \
                  -p 8000:8000 \
                  "$previous_image" || echo "Previous container could not be restored." >&2
              fi
            fi
          }
          trap rollback_on_failure EXIT

          docker rm -f "$container_name" >/dev/null 2>&1 || true
          docker run -d \
            --name "$container_name" \
            --restart unless-stopped \
            --env-file "$env_file" \
            -p 8000:8000 \
            "$IMAGE"

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health/live \
              && curl --fail --silent http://127.0.0.1:8000/health/ready; then
              deployment_succeeded=true
              echo "Deployment is healthy: $IMAGE"
              exit 0
            fi
            sleep 5
          done

          docker logs --tail 100 "$container_name" || true
          echo "Application did not become healthy within 150 seconds." >&2
          exit 1