name: Mitta Enterprise AI CI/CD to AWS

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mitta-aws-production-deployment
  cancel-in-progress: false

jobs:
  integration:
    name: Continuous Integration checks
    runs-on: self-hosted
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m compileall -q app worker

  build-and-push:
    name: Build and push image - Continuous Delivery
    if: github.ref == 'refs/heads/main'
    needs: integration
    environment: production
    runs-on: self-hosted
    permissions:
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-2' }}
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-2' }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'false'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image URI
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY_NAME }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$REGISTRY" || -z "$REPOSITORY" ]]; then
            echo "Set ECR_REPOSITORY_NAME as a GitHub Actions production variable and verify the ECR login output." >&2
            exit 1
          fi
          echo "image=$REGISTRY/$REPOSITORY:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.image }}

  deploy:
    name: Deploy to EC2 - Continuous Deployment
    if: github.ref == 'refs/heads/main'
    needs: build-and-push
    environment: production
    runs-on: [self-hosted, linux, x64, mitta-ec2]
    env:
      AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-2' }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-2' }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy and verify application
        shell: bash
        env:
          IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY_NAME }}:${{ github.sha }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          set -Eeuo pipefail

          container_name="mitta"
          if [[ -z "$IMAGE" || "$IMAGE" != */* ]]; then
            echo "Build job did not provide a valid registry-qualified image URI; check ECR_REPOSITORY_NAME in the GitHub Actions production variables." >&2
            exit 1
          fi
          previous_image=""
          deployment_succeeded=false

          if [[ -z "$DATABASE_URL" || -z "$PINECONE_API_KEY" || -z "$S3_BUCKET" ]]; then
            echo "Set DATABASE_URL and PINECONE_API_KEY as production secrets, and S3_BUCKET as a production secret." >&2
            exit 1
          fi

          app_env=(--env DATABASE_URL --env PINECONE_API_KEY --env S3_BUCKET)

          docker pull "$IMAGE"
          # ... keep the rest of your container stop/run/healthcheck script as-is